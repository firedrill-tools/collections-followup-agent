name: Check
on:
  push:
  pull_request:
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run datasets:check
      - run: npm run check
      - run: npm run package
      - run: npm run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: collections-source
          path: |
            dist/collections-followup-agent-0.2.0-source.tar.gz
            dist/qualification.json
